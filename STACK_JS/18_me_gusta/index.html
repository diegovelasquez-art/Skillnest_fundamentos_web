<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Diego Velásquez">
    <title>Me gusta</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    <header class="barra-navegacion">
        <h1>Social Like</h1>
    </header>

    <div class="contenedor">
        <aside class="tarjeta-perfil">
            <img src="static/images/images (6).jfif" alt="Misato" class="foto-perfil">
            <h2>Misato</h2>
            <button class="btn-perfil">Mi perfil</button>
        </aside>

        <main class="muro">
            <h2>Últimas publicaciones</h2>

            <article class="publicacion">
                <div class="encabezado-publicacion">
                    <h3>Rei</h3>
                    <div class="contenedor-me-gusta">
                        <span id="count-1">0</span> like(s)
                        <button id="btn-1" class="btn-me-gusta">Like</button>
                    </div>
                </div>
                <p class="contenido-publicacion">
                    Acabo de configurar este nuevo <a href="#">bot de Discrod</a>, cuéntame que opinan ustedes.
                </p>
            </article>

            <article class="publicacion">
                <div class="encabezado-publicacion">
                    <h3>Asuka</h3>
                    <div class="contenedor-me-gusta">
                        <span id="count-2">0</span> like(s)
                        <button id="btn-2" class="btn-me-gusta">Like</button>
                    </div>
                </div>
                <p class="contenido-publicacion">
                    Acabo de leer este <a href="#">nuevo comic</a>. Denle un vistazo.
                </p>
            </article>

            <article class="publicacion">
                <div class="encabezado-publicacion">
                    <h3>Shinji</h3>
                    <div class="contenedor-me-gusta">
                        <span id="count-3">0</span> like(s)
                        <button id="btn-3" class="btn-me-gusta">Like</button>
                    </div>
                </div>
                <p class="contenido-publicacion">
                    No puedo dejar de escuchar este <a href="#">album</a>. ¿A quién más le gusta?
                </p>
            </article>
        </main>
    </div>

    <script src="static/js/script.js"></script>
</body>

</html>
