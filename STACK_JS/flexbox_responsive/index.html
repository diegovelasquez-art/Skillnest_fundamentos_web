<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinos destacados</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <main class="contenedor-principal">
        <section class="seccion-destinos">
            <header class="encabezado-seccion">
                <h2>Destinos destacados</h2>
                <p>Explora lugares increíbles para tu próximo viaje.</p>
            </header>

            <div class="grilla-destinos">
                
                <!-- Tarjeta 1 -->
                <article class="tarjeta-destino">
                    <img src="static/images/torresdelpaine.jpg" alt="Torres del Paine" class="imagen-tarjeta">
                    <div class="cuerpo-tarjeta">
                        <h3>Torres del Paine</h3>
                        <span class="nombre-pais">Chile</span>
                        <p class="resumen">Naturaleza y paisajes únicos en la Patagonia.</p>
                        <button class="boton-ver-detalle">Ver más</button>
                    </div>
                </article>

                <!-- Tarjeta 2 -->
                <article class="tarjeta-destino">
                    <img src="static/images/cusco.jpg" alt="Cusco" class="imagen-tarjeta">
                    <div class="cuerpo-tarjeta">
                        <h3>Cusco</h3>
                        <span class="nombre-pais">Perú</span>
                        <p class="resumen">Cultura, historia y tradiciones.</p>
                        <button class="boton-ver-detalle">Ver más</button>
                    </div>
                </article>

                <!-- Tarjeta 3 -->
                <article class="tarjeta-destino">
                    <img src="static/images/cancun.webp" alt="Cancún" class="imagen-tarjeta">
                    <div class="cuerpo-tarjeta">
                        <h3>Cancún</h3>
                        <span class="nombre-pais">México</span>
                        <p class="resumen">Playas y descanso frente al mar.</p>
                        <button class="boton-ver-detalle">Ver más</button>
                    </div>
                </article>

                <!-- Tarjeta 4 -->
                <article class="tarjeta-destino">
                    <img src="static/images/madrid.jpg" alt="Madrid" class="imagen-tarjeta">
                    <div class="cuerpo-tarjeta">
                        <h3>Madrid</h3>
                        <span class="nombre-pais">España</span>
                        <p class="resumen">Gastronomía, museos y vida urbana.</p>
                        <button class="boton-ver-detalle">Ver más</button>
                    </div>
                </article>

            </div>
        </section>
    </main>

</body>
</html>
